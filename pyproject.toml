[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "1.0.0"
description = "本地私有文档库智能问答与辅助创作工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.0.0",
    "Pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
