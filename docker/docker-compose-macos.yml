# macOS Docker Compose configuration for RAGFlow with PostgreSQL
# This file includes all required services without profiles

volumes:
  postgres_data:
    driver: local
  esdata01:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  ragflow:
    driver: bridge

services:
  # PostgreSQL - Relational database
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DBNAME:-rag_flow}
      - POSTGRES_USER=${POSTGRES_USER:-rag_flow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-infini_rag_flow}
    command:
      - -c
      - max_connections=1000
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_flow} -d ${POSTGRES_DBNAME:-rag_flow}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  # Elasticsearch - Vector database
  es01:
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    ports:
      - ${ES_PORT}:9200
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  # Redis - Cache
  redis:
    image: valkey/valkey:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    env_file: .env
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120

  # MinIO - Object storage
  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120

  # RAGFlow Application (后端 API 服务)
  ragflow:
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    command:
      - --enable-adminserver
    environment:
      - RAGFLOW_USE_DEFAULT_USER=true
      - ENABLE_WEBSERVER=1
      - ENABLE_ADMIN_SERVER=1
      - ENABLE_DATASYNC=1
      - API_PROXY_SCHEME=python
    ports:
      - ${SVR_HTTP_PORT}:9380
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/ragflow.conf/ragflow.conf.python:/etc/nginx/conf.d/ragflow.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      # 挂载自定义 API 文件
      - ../api/apps/restful_apis/file_sync_api.py:/ragflow/api/apps/restful_apis/file_sync_api.py
      - ../api/apps/restful_apis/dataset_api.py:/ragflow/api/apps/restful_apis/dataset_api.py
      - ../api/apps/restful_apis/document_api.py:/ragflow/api/apps/restful_apis/document_api.py
      - ../api/apps/restful_apis/chat_api.py:/ragflow/api/apps/restful_apis/chat_api.py
      - ../api/apps/restful_apis/document_creation_api.py:/ragflow/api/apps/restful_apis/document_creation_api.py
      - ../api/apps/restful_apis/document_optimization_api.py:/ragflow/api/apps/restful_apis/document_optimization_api.py
      - ../api/apps/backward_compat.py:/ragflow/api/apps/backward_compat.py
      - ../api/apps/__init__.py:/ragflow/api/apps/__init__.py
      - ../api/utils/json_encode.py:/ragflow/api/utils/json_encode.py
      # 挂载 prompt 文件
      - ../rag/prompts/doc_creation.md:/ragflow/rag/prompts/doc_creation.md
      - ../rag/prompts/doc_optimization.md:/ragflow/rag/prompts/doc_optimization.md
      # 挂载 DB services 文件
      - ../api/db/services/dialog_service.py:/ragflow/api/db/services/dialog_service.py
      # 挂载前端构建文件到容器，让 nginx 提供最新的前端页面
      - ../web/dist:/ragflow/web/dist
      # 挂载主机文档目录到容器，支持前端浏览和同步
      - /Users/yanghanxuan/Documents/工作/入职/国网新员工培训/AI+ 微创新/创客营:/data/workspace
      - /Users/yanghanxuan/Documents/工作/日常/考试 RAG:/data/exam-docs
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
